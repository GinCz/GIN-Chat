# Example Docker Compose configuration for GIN-Chat
# Replace placeholder values with your own environment variables

version: "3.8"

services:
  gin-chat:
    image: gincz/gin-chat:latest
    container_name: gin-chat
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=YOUR_RANDOM_SECURE_JWT_SECRET
      - ENCRYPT_SECRET=YOUR_DATABASE_ENCRYPTION_KEY
      - ADMIN_PASSWORD=YOUR_SUPERADMIN_PASSWORD
      - TG_BOT_TOKEN=YOUR_TELEGRAM_BOT_TOKEN
      - TG_ADMIN_CHAT_ID=YOUR_TELEGRAM_CHAT_ID
